{{define "content"}}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
        <a href="/projects" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">View Projects</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-sm font-medium text-gray-500">Projects</h3>
            <p class="text-3xl font-bold text-gray-900">{{len .Projects}}</p>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="px-6 py-4 border-b">
            <h2 class="text-lg font-semibold text-gray-900">Your Projects</h2>
        </div>
        <div class="p-6">
            {{if .Projects}}
            <div class="space-y-3">
                {{range .Projects}}
                <a href="/projects/{{.ID}}" class="block p-4 border rounded-lg hover:bg-gray-50 transition">
                    <h3 class="font-medium text-gray-900">{{.Name}}</h3>
                    <p class="text-sm text-gray-500">{{.Description}}</p>
                </a>
                {{end}}
            </div>
            {{else}}
            <p class="text-gray-500 text-center py-8">No projects yet. <a href="/projects" class="text-blue-600 hover:underline">Create one</a>.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
{{template "base.html" .}}
