{{template "base" .}}
{{define "agent_wake_content"}}
<div class="space-y-6">
    {{template "agent_header" .}}

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" action="/agents/{{.Agent.ID}}" class="space-y-4">
            <input type="hidden" name="name" value="{{.Agent.Name}}">
            <input type="hidden" name="mission" value="{{.Agent.Mission}}">
            <input type="hidden" name="dockerfile" value="{{.Agent.Dockerfile}}">
            <input type="hidden" name="is_active" value="{{if .Agent.IsActive}}on{{end}}">
            <div>
                <label class="block text-sm font-medium text-gray-700">Cron Expression</label>
                <input type="text" name="cron_expression" value="{{.Agent.CronExpression}}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Wake Up Prompt</label>
                <textarea name="prompt" rows="8" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2 font-mono text-sm">{{.Agent.Prompt}}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Wake Up Script</label>
                <textarea name="script" rows="8" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2 font-mono text-sm">{{.Agent.Script}}</textarea>
                <p class="mt-1 text-xs text-gray-500">Optional shell script executed at wake-up. The prompt is passed as $WAKEUP_PROMPT and mission as $AGENT_MISSION.</p>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">Update Wake Up</button>
        </form>
    </div>
</div>
{{end}}
