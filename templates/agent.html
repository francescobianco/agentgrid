{{template "base" .}}
{{define "agent_content"}}
<div class="space-y-6">
    {{template "agent_header" .}}

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" action="/agents/{{.Agent.ID}}" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" value="{{.Agent.Name}}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mission</label>
                <textarea name="mission" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">{{.Agent.Mission}}</textarea>
            </div>
            <input type="hidden" name="cron_expression" value="{{.Agent.CronExpression}}">
            <input type="hidden" name="prompt" value="{{.Agent.Prompt}}">
            <input type="hidden" name="dockerfile" value="{{.Agent.Dockerfile}}">
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_active" id="is_active" {{if .Agent.IsActive}}checked{{end}} class="rounded border-gray-300">
                <label for="is_active" class="text-sm text-gray-700">Active</label>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">Update Agent</button>
                <form method="post" action="/agents/{{.Agent.ID}}/delete" class="inline" onsubmit="return confirm('Delete this agent?')">
                    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition text-sm">Delete</button>
                </form>
            </div>
        </form>
    </div>
</div>
{{end}}
