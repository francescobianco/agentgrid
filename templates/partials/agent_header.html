{{define "agent_header"}}
<div class="space-y-4 mb-6">
    <div class="flex items-center gap-4">
        <a href="/projects/{{.Project.ID}}" class="text-blue-600 hover:underline text-sm">&larr; {{.Project.Name}}</a>
        <h1 class="text-2xl font-bold text-gray-900">{{.Agent.Name}}</h1>
    </div>
    <div class="flex gap-3">
        <form method="post" action="/agents/{{.Agent.ID}}/run" class="inline">
            <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition text-sm font-medium">Run Now</button>
        </form>
        <form method="post" action="/agents/{{.Agent.ID}}/dry-run" class="inline">
            <button type="submit" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition text-sm font-medium">Dry Run</button>
        </form>
    </div>
    <div class="border-b">
        <nav class="flex -mb-px">
            <a href="/agents/{{.Agent.ID}}" class="tab-btn {{if eq .ActiveTab "agent"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Agent</a>
            <a href="/agents/{{.Agent.ID}}/wake" class="tab-btn {{if eq .ActiveTab "wake"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Wake Up</a>
            <a href="/agents/{{.Agent.ID}}/docker" class="tab-btn {{if eq .ActiveTab "docker"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Docker</a>
            <a href="/agents/{{.Agent.ID}}/files" class="tab-btn {{if eq .ActiveTab "files"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Files</a>
            <a href="/agents/{{.Agent.ID}}/sessions" class="tab-btn {{if eq .ActiveTab "sessions"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Sessions</a>
            <a href="/agents/{{.Agent.ID}}/logs" class="tab-btn {{if eq .ActiveTab "logs"}}border-blue-500 text-blue-600{{else}}border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300{{end}} border-b-2 px-6 py-3 text-sm font-medium">Logs</a>
        </nav>
    </div>
</div>
{{end}}
