{{template "base" .}}
{{define "projects_content"}}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">Projects</h1>
        <a href="/projects/new" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">New Project</a>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            {{if .Projects}}
            <div class="space-y-3">
                {{range .Projects}}
                <div class="flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition">
                    <a href="/projects/{{.ID}}" class="flex-1">
                        <h3 class="font-medium text-gray-900">{{.Name}}</h3>
                        <p class="text-sm text-gray-500">{{.Description}}</p>
                    </a>
                    <form method="post" action="/projects/{{.ID}}/delete" class="ml-4" onsubmit="return confirm('Delete this project?')">
                        <button type="submit" class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                    </form>
                </div>
                {{end}}
            </div>
            {{else}}
            <p class="text-gray-500 text-center py-8">No projects yet. <a href="/projects/new" class="text-blue-600 hover:underline">Create one</a>.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
