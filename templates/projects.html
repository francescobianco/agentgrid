{{template "base" .}}
{{define "projects_content"}}
<div class="space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">Projects</h1>

    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">New Project</h2>
        <form method="post" action="/projects" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea name="description" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"></textarea>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">Create Project</button>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="px-6 py-4 border-b">
            <h2 class="text-lg font-semibold text-gray-900">All Projects</h2>
        </div>
        <div class="p-6">
            {{if .Projects}}
            <div class="space-y-3">
                {{range .Projects}}
                <div class="flex items-center justify-between p-4 border rounded-lg">
                    <a href="/projects/{{.ID}}" class="flex-1">
                        <h3 class="font-medium text-gray-900">{{.Name}}</h3>
                        <p class="text-sm text-gray-500">{{.Description}}</p>
                    </a>
                    <form method="post" action="/projects/{{.ID}}/delete" class="ml-4" onsubmit="return confirm('Delete this project?')">
                        <button type="submit" class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                    </form>
                </div>
                {{end}}
            </div>
            {{else}}
            <p class="text-gray-500 text-center py-8">No projects yet.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
