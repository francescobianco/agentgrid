{{template "base" .}}
{{define "agent_runs_content"}}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="/agents/{{.Agent.ID}}" class="text-blue-600 hover:underline text-sm">&larr; {{.Agent.Name}}</a>
        <h1 class="text-2xl font-bold text-gray-900">Runs</h1>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="p-6">
            {{if .Runs}}
            <div class="space-y-3">
                {{range .Runs}}
                <div class="p-4 border rounded-lg">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-500">Run #{{.ID}}</span>
                        <span class="text-sm px-2 py-1 rounded {{if eq .Status "completed"}}bg-green-100 text-green-800{{else if eq .Status "failed"}}bg-red-100 text-red-800{{else if eq .Status "running"}}bg-blue-100 text-blue-800{{else}}bg-gray-100 text-gray-800{{end}}">
                            {{.Status}}
                        </span>
                    </div>
                    <p class="text-sm text-gray-500">{{.CreatedAt.Format "Jan 02, 2006 15:04 UTC"}}</p>
                    {{if .Output}}
                    <pre class="mt-2 p-3 bg-gray-50 rounded text-xs overflow-x-auto">{{.Output}}</pre>
                    {{end}}
                </div>
                {{end}}
            </div>
            {{else}}
            <p class="text-gray-500 text-center py-8">No runs yet.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
