{{template "base" .}}
{{define "project_new_content"}}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="/projects" class="text-blue-600 hover:underline text-sm">&larr; Projects</a>
        <h1 class="text-2xl font-bold text-gray-900">New Project</h1>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" action="/projects" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea name="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"></textarea>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">Create Project</button>
                <a href="/projects" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition text-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
