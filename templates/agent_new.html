{{template "base" .}}
{{define "agent_new_content"}}
<div class="space-y-6">
    <div class="flex items-center gap-4">
        <a href="/projects/{{.Project.ID}}" class="text-blue-600 hover:underline text-sm">&larr; {{.Project.Name}}</a>
        <h1 class="text-2xl font-bold text-gray-900">New Agent</h1>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post" action="/projects/{{.Project.ID}}/agents" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cron Expression</label>
                    <input type="text" name="cron_expression" placeholder="*/5 * * * *" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Docker Image</label>
                    <input type="text" name="docker_image" placeholder="alpine:latest" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Working Directory</label>
                    <input type="text" name="working_directory" placeholder="/work" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Prompt</label>
                <textarea name="prompt" rows="4" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Dockerfile (optional)</label>
                <textarea name="dockerfile" rows="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2 font-mono text-sm"></textarea>
                <p class="mt-1 text-xs text-gray-500">If provided, AgentGrid will build the image from this Dockerfile instead of pulling the image above.</p>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">Create Agent</button>
                <a href="/projects/{{.Project.ID}}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition text-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
