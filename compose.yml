services:
  agentgrid:
    build: .
    container_name: agentgrid
    ports:
      - "8067:8067"
    volumes:
      - agentgrid-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AGENTGRID_MODE: local
      PORT: "8067"
      DATABASE_PATH: /app/data/agentgrid.db
    restart: unless-stopped

volumes:
  agentgrid-data:
